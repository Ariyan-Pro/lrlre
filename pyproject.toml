[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrlre"
version = "13.0.0"
description = "Low-Resource Language Reasoning Engine - Enterprise symbolic NLP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "LRLRE Project", email = "lrlre@example.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104.1,<0.105.0",
    "uvicorn>=0.24.0,<0.25.0",
    "sqlalchemy>=2.0.23,<2.1.0",
    "networkx>=3.6.1,<3.7.0",
    "pydantic>=2.12.5,<2.13.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
prod = [
    "gunicorn>=20.0.0",
    "redis>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/dell/lrlre"
Documentation = "https://github.com/dell/lrlre#readme"
Repository = "https://github.com/dell/lrlre"
"Issue Tracker" = "https://github.com/dell/lrlre/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lrlre*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py311']